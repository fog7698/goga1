<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>TOKYO VPN — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Sora:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Sora', system-ui, sans-serif;
    background: var(--tg-theme-bg-color, #0a0714);
    color: var(--tg-theme-text-color, #f3f0fb);
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .display { font-family: 'Orbitron', sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 14px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: #b3a9d4; cursor: pointer; }
  .tab.active { background: #ff3b3b; color: #fff; }
  .card { border-radius: 18px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); padding: 20px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; font-family: 'Orbitron', sans-serif; }
  .muted { color: #a89bcf; font-size: 12.5px; }
  .expiry { font-size: 22px; font-weight: 800; font-family: 'Orbitron', sans-serif; margin: 10px 0 2px; }
  .coins-row { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 800; }
  .connect-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 14.5px; border: none; margin-top: 10px; color: #fff; cursor: pointer; }
  .connect-btn.happ { background: #ff3b3b; }
  .connect-btn.incy { background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18); }
  .empty-state { text-align: center; padding: 10px 0 4px; }
  .empty-state a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 999px; background: #ff3b3b; color: #fff; font-weight: 700; font-size: 13.5px; text-decoration: none; }
  .progress-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 8px 0 2px; }
  .progress-fill { height: 100%; background: #ff3b3b; border-radius: 999px; }
  .progress-label { font-size: 11.5px; color: #a89bcf; display: flex; justify-content: space-between; gap: 8px; }
  .media-account-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12.5px; }
  .media-account-row:first-child { border-top: none; }
  .media-status { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .media-status.pending { background: rgba(63,216,255,0.14); color: #3fd8ff; }
  .media-status.approved { background: rgba(78,232,155,0.14); color: #4ee89b; }
  .media-status.rejected { background: rgba(255,111,145,0.14); color: #ff6f91; }
  .field-row { display: flex; gap: 8px; margin-top: 10px; }
  .field-select, .field-input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.25); color: #f3f0fb; font-size: 13px; }

  .copy-row { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 10px; }
  .copy-text { flex: 1; min-width: 0; border: none; background: transparent; color: #d6cfec; font-size: 12px; padding: 4px 2px; }
  .copy-btn { flex: 0 0 auto; padding: 8px 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: #f3f0fb; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .copy-btn.copied { background: rgba(78,232,155,0.2); color: #4ee89b; }

  .subpage { position: fixed; inset: 0; background: #0a0714; z-index: 40; display: none; flex-direction: column; }
  .subpage.show { display: flex; }
  .subpage-header { display: flex; align-items: center; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex: 0 0 auto; }
  .subpage-back { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.08); color: #f3f0fb; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
  .subpage-title { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; }
  .subpage-body { flex: 1; overflow-y: auto; padding: 16px 16px max(24px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; width: 100%; box-sizing: border-box; }

  .prize-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 4px; }
  .prize-card { border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); text-align: center; position: relative; }
  .prize-card.locked { opacity: 0.55; }
  .prize-card.reached { border-color: rgba(78,232,155,0.5); }
  .prize-card img { display: block; width: 100%; height: 90px; object-fit: contain; background: rgba(255,255,255,0.03); padding: 8px; box-sizing: border-box; }
  .prize-card .prize-icon-wrap { width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); }
  .prize-card .prize-body { padding: 8px 10px 10px; }
  .prize-card .prize-need { font-size: 10px; color: #a89bcf; font-weight: 800; margin-bottom: 3px; }
  .prize-card .prize-name { font-size: 10.5px; line-height: 1.25; min-height: 26px; }
  .prize-card .prize-cash { font-size: 10px; color: #ffd27a; margin-top: 3px; font-weight: 700; }
  .prize-card .reached-badge { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: #4ee89b; display: flex; align-items: center; justify-content: center; }

  .inv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .inv-card { border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); padding: 10px; text-align: center; }
  .inv-img { width: 100%; height: 64px; object-fit: contain; background: rgba(255,255,255,0.03); border-radius: 8px; }
  .inv-name { font-size: 11px; margin-top: 6px; line-height: 1.25; min-height: 28px; }
  .inv-price { font-size: 12px; font-weight: 700; color: #ffd27a; margin-top: 2px; }

  .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .plan-card { border-radius: 16px; padding: 16px 12px; text-align: center;
    background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border: 1px solid rgba(255,255,255,0.1); }
  .plan-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .plan-price { font-size: 19px; font-weight: 800; font-family: 'Orbitron', sans-serif; color: #ffd27a; margin-bottom: 12px; }
  .gate-note { margin-top: 10px; }
  .gate-link { display: block; text-align: center; text-decoration: none; margin-top: 8px; }

  .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .case-card {
    border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer;
    background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.1); transition: border-color .2s, transform .2s;
  }
  .case-card:active { transform: scale(0.97); }
  .case-card.tier-0 { --tier-a: #3fd8ff; --tier-b: #2a8fd9; }
  .case-card.tier-1 { --tier-a: #ff2fb0; --tier-b: #a24bff; }
  .case-card.tier-2 { --tier-a: #ffcf5c; --tier-b: #ff8a3d; }
  .case-card.tier-3 { --tier-a: #ff4d6d; --tier-b: #ff2fb0; }
  .case-card:hover { border-color: color-mix(in srgb, var(--tier-a) 60%, transparent); }

  .case-crate { position: relative; width: 92px; height: 92px; margin: 0 auto 8px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(145deg, #201a38, #0c0918);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 22px -10px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .case-card:hover .case-crate { transform: perspective(400px) rotateX(6deg) rotateY(-8deg) translateY(-3px) scale(1.04);
    box-shadow: 0 16px 26px -10px rgba(0,0,0,0.7), 0 0 22px -4px var(--tier-a); }
  .crate-glow { position: absolute; inset: -30%; background: radial-gradient(circle, var(--tier-a), transparent 65%); opacity: .3; filter: blur(6px); animation: crate-pulse 2.6s ease-in-out infinite; }
  .crate-shine { position: absolute; top: -60%; left: -70%; width: 40%; height: 220%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent); transform: rotate(18deg); animation: crate-shine 3.4s ease-in-out infinite; pointer-events: none; }
  .crate-emblem { position: relative; color: var(--tier-a); filter: drop-shadow(0 0 10px var(--tier-a)); display: flex; }
  .crate-band { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: linear-gradient(90deg, var(--tier-a), var(--tier-b)); }
  .crate-lock { position: absolute; bottom: -5px; right: -5px; width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--tier-a), var(--tier-b)); border: 2px solid rgba(10,7,20,0.9);
    display: flex; align-items: center; justify-content: center; }
  @keyframes crate-shine { 0%, 100% { left: -70%; } 50% { left: 130%; } }
  @keyframes crate-pulse { 0%, 100% { opacity: .22; } 50% { opacity: .48; } }

  .case-tier-tag { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--tier-a); margin-bottom: 2px; }
  .case-title { font-size: 12.5px; font-weight: 600; }
  .case-cost { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 12.5px; color: #ffd27a; margin: 6px 0 10px; font-weight: 700; }
  .case-open-btn { width: 100%; padding: 10px; border-radius: 10px; border: none; background: #ff3b3b; color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .case-open-btn:disabled { opacity: 0.4; }
  .case-preview-btn { width: 100%; padding: 9px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); color: #f3f0fb; }

  /* rarity palette, CS:GO-style */
  .r-common { --r: #b0c3d9; } .r-uncommon { --r: #5e98d9; } .r-rare { --r: #7b5cff; } .r-epic { --r: #d32ce6; } .r-legendary { --r: #ff4655; }

  .case-modal-overlay { position: fixed; inset: 0; background: rgba(5,3,12,0.86); display: none; align-items: flex-end; justify-content: center; z-index: 25; }
  .case-modal-overlay.show { display: flex; }
  .case-modal { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: linear-gradient(180deg, #171126, #0a0714);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 22px 22px 0 0; padding: 20px; position: relative; }
  .case-modal-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.08); color: #f3f0fb; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .case-modal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-right: 30px; }
  .case-modal-head h3 { margin: 0 0 4px; font-family: 'Orbitron', sans-serif; font-size: 16px; }
  .cm-prizes-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #a89bcf; margin: 4px 0 8px; }
  .cm-prizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .prize-chip { border-radius: 12px; padding: 10px 6px 8px; text-align: center; background: rgba(255,255,255,0.04);
    border: 1px solid color-mix(in srgb, var(--r) 45%, rgba(255,255,255,0.1)); box-shadow: inset 0 0 14px -6px color-mix(in srgb, var(--r) 70%, transparent); }
  .prize-chip .pc-icon { color: var(--r); filter: drop-shadow(0 0 6px var(--r)); display: flex; align-items: center; justify-content: center; }
  .prize-chip .pc-title { font-size: 10.5px; margin: 4px 0 2px; line-height: 1.2; min-height: 24px; }
  .prize-chip .pc-chance { font-size: 10px; font-weight: 800; color: var(--r); }

  .roulette-wrap { position: relative; margin-bottom: 18px; display: none; }
  .roulette-viewport { overflow: hidden; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.25)); height: 104px; }
  .roulette-strip { display: flex; height: 100%; will-change: transform; }
  .roulette-cell { flex: 0 0 92px; margin: 6px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); border: 1px solid color-mix(in srgb, var(--r) 50%, rgba(255,255,255,0.1));
    box-shadow: inset 0 0 12px -6px color-mix(in srgb, var(--r) 70%, transparent); }
  .roulette-cell .rc-icon { color: var(--r); filter: drop-shadow(0 0 6px var(--r)); display: flex; align-items: center; justify-content: center; }
  .roulette-cell.win { animation: win-pulse .6s ease-in-out 2; border-color: var(--r); }
  @keyframes win-pulse { 0%, 100% { box-shadow: inset 0 0 12px -6px var(--r); } 50% { box-shadow: 0 0 22px 2px var(--r); } }
  .roulette-pointer { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 2px; background: #ff3b3b;
    transform: translateX(-50%); z-index: 2; box-shadow: 0 0 10px #ff3b3b; }
  .roulette-pointer::before, .roulette-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    border: 7px solid transparent; }
  .roulette-pointer::before { top: -6px; border-top: 0; border-bottom-color: #ff3b3b; }
  .roulette-pointer::after { bottom: -6px; border-bottom: 0; border-top-color: #ff3b3b; }
  .result-overlay { position: fixed; inset: 0; background: rgba(5,3,12,0.82); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .result-overlay.show { display: flex; }
  .result-card { background: linear-gradient(165deg, rgba(255,59,59,0.22), rgba(20,14,36,0.98)); border: 1px solid rgba(255,59,59,0.5); border-radius: 20px; padding: 30px 26px; text-align: center; max-width: 320px; }
  .result-icon { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,59,59,0.28), transparent 70%); }
  .result-card h3 { margin: 0 0 6px; font-family: 'Orbitron', sans-serif; font-size: 17px; }
  .result-card button { margin-top: 18px; padding: 12px 26px; border-radius: 999px; border: none; background: #ff3b3b; color: #fff; font-weight: 700; cursor: pointer; }

  /* Круг апгрейдера — subscription-upgrade gauge, deliberately off-brand (navy/orange) so the
     staking game reads apart from the rest of the app's pink/purple chrome. */
  .ug-panel { border-radius: 18px; background: linear-gradient(#202630,#11151c); border: 1px solid rgba(255,255,255,0.08); padding: 18px 16px 20px; margin-bottom: 14px; font-family: Arial, Helvetica, sans-serif; }
  .ug-eyebrow { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; color: #9da5b1; font-size: 11px; font-weight: bold; letter-spacing: 1.4px; text-transform: uppercase; }
  .ug-live { color: #58d78e; letter-spacing: normal; text-transform: none; }
  .ug-live:before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #58d78e; box-shadow: 0 0 10px #58d78e; }
  .ug-sub-row { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 2px 16px; padding-bottom: 14px; border-bottom: 1px solid #2a313c; color: #fff; }
  .ug-mult-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .ug-mult-btn { text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid #4d5663; background: #29313c; cursor: pointer; color: #fff; }
  .ug-mult-btn.active { border-color: transparent; background: linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008); box-shadow: 0 8px 18px -6px rgba(255,103,11,.4); }
  .ug-mult-val { font-size: 15px; font-weight: 800; }
  .ug-mult-chance { font-size: 10.5px; font-weight: 700; margin-top: 3px; color: #8fd98f; }
  .ug-mult-btn.active .ug-mult-chance { color: #fff0dc; }
  .ug-gauge-wrap { position: relative; width: min(100%, 320px); margin: 0 auto; aspect-ratio: 1; }
  .ug-needle { transform-origin: 220px 220px; transform: rotate(0deg); }
  .ug-center { position: absolute; inset: 0; display: grid; place-content: center; align-content: center; gap: 6px; text-align: center; pointer-events: none; }
  .ug-percent { font-size: clamp(30px, 8vw, 42px); font-weight: 800; letter-spacing: -2px; color: #fff; text-shadow: 0 3px 10px #000; }
  .ug-caption { font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px #000; }
  .ug-outcome { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 16px; color: #fff; }
  .ug-cta { width: 100%; padding: 13px; border-radius: 12px; background: linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008); color: #fff; font-weight: 800; font-size: 14px; text-align: center; border: none; cursor: pointer; box-shadow: 0 14px 26px -10px rgba(255,103,11,.33); }
  .ug-cta:disabled { opacity: .5; }
  .ug-hint { margin: 14px auto 0; max-width: 310px; color: #89919d; font-size: 11.5px; line-height: 1.45; text-align: center; }
  .ug-fair-link { display: block; text-align: center; margin-top: 8px; font-size: 11px; color: #6c9fd9; text-decoration: underline; }

  .ug-stake-toggle { display: flex; gap: 8px; margin: 4px 0 14px; }
  .ug-stake-btn { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid #4d5663; background: #29313c; cursor: pointer; color: #cfd4db; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ug-stake-btn.active { border-color: transparent; background: linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008); color: #fff; }
  .ug-slider-row { margin-bottom: 16px; }
  .ug-slider-label { display: flex; justify-content: space-between; font-size: 12px; color: #c7ccd3; margin-bottom: 8px; }
  .ug-slider-label b { color: #fff; font-size: 14px; }
  .ug-slider { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: #303742; outline: none; }
  .ug-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008); border: 2px solid #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .ug-slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008); border: 2px solid #fff; cursor: pointer; }

  .confetti-canvas { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  @keyframes result-shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
  .result-card.lose { animation: result-shake .55s cubic-bezier(.36,.07,.19,.97); border-color: rgba(255,90,90,0.7); }
  @keyframes result-flash { 0% { background: rgba(255,59,59,0.35); } 100% { background: rgba(5,3,12,0.82); } }
  .result-overlay.lose { animation: result-flash .6s ease-out; }

  @media (max-width: 380px) {
    .coins-row { font-size: 22px; }
    .case-crate { width: 78px; height: 78px; }
    .tab { font-size: 11.5px; gap: 4px; padding: 10px 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';
let botUsername = null;
const botUsernameReady = fetch('/api/status').then((r) => r.json()).then((s) => { botUsername = s.botUsername; }).catch(() => {});

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), 'X-Telegram-Init-Data': initData, 'Content-Type': 'application/json' },
  });
  if (!res.ok) throw new Error(await res.text().catch(() => res.statusText));
  return res.json();
}

function openLink(url) {
  if (tg && tg.openLink) tg.openLink(url, { try_instant_view: false });
  else window.location.href = url;
}

function fmtDate(sqlDate) {
  if (!sqlDate) return '—';
  const d = new Date(sqlDate.replace(' ', 'T') + 'Z');
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function progressPct(current, base, target) {
  if (!target || target <= base) return 100;
  return Math.min(100, Math.max(0, ((current - base) / (target - base)) * 100));
}

const MEDIA_PLATFORM_LABEL = { youtube: 'YouTube', instagram: 'Instagram', tiktok: 'TikTok' };
const MEDIA_STATUS_LABEL = { pending: 'на модерации', approved: 'одобрено', rejected: 'отклонено' };

async function copyToClipboard(text, btn) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (btn) {
      const original = btn.textContent;
      btn.textContent = 'Скопировано';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
    }
  } catch {
    if (tg && tg.showAlert) tg.showAlert('Не удалось скопировать — выделите ссылку вручную.');
  }
}

function openSubPage(title) {
  document.getElementById('subpage-title').textContent = title;
  document.getElementById('subpage-body').innerHTML = '<div class="card muted">Загрузка…</div>';
  document.getElementById('subpage').classList.add('show');
}
function closeSubPage() {
  document.getElementById('subpage').classList.remove('show');
}
document.getElementById('subpage-back').addEventListener('click', closeSubPage);

function prizeGalleryHtml(milestones, currentValue, extraLine) {
  return `<div class="prize-gallery">
    ${milestones.map((m) => {
      const threshold = m.count ?? m.views;
      const reached = threshold <= currentValue;
      const media = m.image
        ? `<img src="${m.image}" alt="">`
        : `<div class="prize-icon-wrap">${svgIcon(m.icon || 'coin', 32, { color: reached ? '#4ee89b' : '#a89bcf' })}</div>`;
      return `
      <div class="prize-card ${reached ? 'reached' : 'locked'}">
        ${reached ? `<div class="reached-badge">${svgIcon('shieldCheck', 12, { color: '#0c2216', strokeWidth: 3 })}</div>` : ''}
        ${media}
        <div class="prize-body">
          <div class="prize-need">${threshold.toLocaleString('ru-RU')}</div>
          <div class="prize-name">${m.prize}</div>
          ${extraLine ? `<div class="prize-cash">${extraLine(m)}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

let lastReferrals = null;

      <div class="copy-row" style="margin-top:10px;">
        <input class="copy-text" id="ref-link-input-2" readonly value="${link}" onclick="this.select()">
        <button class="copy-btn" id="copy-ref-link-2">Копировать</button>
      </div>
    </div>
    <div class="card">
      <div class="muted">Оплативших рефералов</div>
      <div class="expiry" style="font-size:30px;">${referrals.stats.payingReferrals}</div>

    </div>

      ${prizeGalleryHtml(referrals.milestones, referrals.stats.payingReferrals, (m) => `или ${m.cashRub.toLocaleString('ru-RU')} ₽`)}
      ${referrals.stats.nextMilestone ? `

  body.innerHTML = `
    <div class="card">
      <h2>Продвигайте TOKYO VPN</h2>
      <div class="muted">Публикуйте ролики с рекламой (баннер, прямая или нативная — без накрутки, в описании юзер или ссылка бота) и получайте <b style="color:#f3f0fb">$${mediaInfo.payoutPer100k}</b> за каждые 100 000 просмотров, выплата раз в неделю через поддержку.</div>
    </div>

    </div>
    <div class="card">

      ${mediaInfo.stats.nextMilestone ? `

        <div class="progress-track"><div class="progress-fill" style="width:${progressPct(mediaInfo.stats.totalViews, mediaInfo.stats.progressBase, mediaInfo.stats.nextMilestone.views)}%"></div></div>`

        <div class="media-account-row">
          <span>${MEDIA_PLATFORM_LABEL[a.platform] || a.platform}${a.status === 'approved' ? ` · ${a.views.toLocaleString('ru-RU')} просм.` : ''}</span>

async function activateTrial(btn, trialDays) {
  const gateEl = document.getElementById('trial-gate');

    renderSubs();
  } catch (e) {
    let payload = null;
    try { payload = JSON.parse(e.message); } catch {}
    if (payload?.error === 'channel_required') {
      gateEl.innerHTML = `
        <div class="muted gate-note">Подпишитесь на наш канал, чтобы активировать пробный период.</div>

        <button class="case-preview-btn gate-note" id="trial-recheck">Я подписался, проверить</button>`;

    } else {
      gateEl.innerHTML = '<div class="muted gate-note">Не получилось активировать, попробуйте ещё раз.</div>';
    }
    btn.disabled = false;
  }

function svgIcon(name, size, opts = {}) {
  if (name === 'coin') return coinIcon(size);
  const color = opts.color || 'currentColor';
  const strokeWidth = opts.strokeWidth || 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
}

const TIER_ICONS = ['radar', 'gem', 'crown', 'flame'];
const TIER_NAMES = ['RECON', 'PRIME', 'ELITE', 'COVERT'];
const KIND_ICON = { days: 'shieldCheck', percent: 'ticketPercent', coins: 'coin' };
let casesList = [];
let activeCase = null; // { c, tierIdx, totalWeight, spinning }
let activeUpgrade = null; // { multiplier, stakeType, stakeAmount, spinning }

function rewardText(item) {
  return item.kind === 'days' ? `+${item.value} дней подписки`
    : item.kind === 'percent' ? `Скидка ${item.value}% на оплату`
    : item.kind === 'skin' ? `${item.title} · ${Math.round(item.value).toLocaleString('ru-RU')} ₽`
    : `+${item.value} монет`;
}

function prizeIconHtml(item, size) {
  if (item.kind === 'skin' && item.imageUrl) {
    return `<img src="${item.imageUrl}" style="width:${size}px;height:${size}px;object-fit:contain;border-radius:6px;">`;
  }
  return svgIcon(item.kind === 'skin' ? 'gem' : (KIND_ICON[item.kind] || 'coin'), size);
}

function rarityOf(item, totalWeight) {
  const p = (item.weight / totalWeight) * 100;
  if (p >= 35) return 'r-common';
  if (p >= 20) return 'r-uncommon';
  if (p >= 10) return 'r-rare';
  if (p >= 4) return 'r-epic';
  return 'r-legendary';
}

function pickWeightedClient(items) {
  const total = items.reduce((s, it) => s + Math.max(0, it.weight), 0);
  let roll = Math.random() * total;
  for (const it of items) {
    roll -= Math.max(0, it.weight);
    if (roll <= 0) return it;
  }
  return items[items.length - 1];
}

function costLineHtml(c, size) {
  return c.currency === 'days'
    ? `${svgIcon('shieldCheck', size, { color: '#ffd27a' })} ${c.cost_days} дн.`
    : `${svgIcon('coin', size, { color: '#ffd27a' })} ${c.cost_coins}`;
}

function caseGridHtml(list) {
  return list.map((c, i) => {
    const tierIdx = i % TIER_ICONS.length;
    return `
    <div class="case-card tier-${tierIdx}" data-key="${c.key}">
      <div class="case-crate">
        <div class="crate-glow"></div>
        <div class="crate-shine"></div>
        <div class="crate-emblem">${svgIcon(TIER_ICONS[tierIdx], 38)}</div>
        <div class="crate-band"></div>
        <div class="crate-lock">${svgIcon('lock', 12, { color: '#0c0918', strokeWidth: 2.4 })}</div>
      </div>
      <div class="case-tier-tag">${TIER_NAMES[tierIdx]}</div>
      <div class="case-title">${c.title}</div>
      <div class="case-cost">${costLineHtml(c, 14)}</div>
      <button class="case-preview-btn" data-key="${c.key}">Смотреть призы</button>
    </div>`;
  }).join('');
}

async function renderCases() {
  const el = document.getElementById('view-cases');
  el.innerHTML = '<div class="card muted">Загрузка…</div>';

  try { data = await api('/api/app/cases'); }
  catch { el.innerHTML = '<div class="card muted">Откройте кейсы из бота TOKYO VPN.</div>'; return; }

  // Normalize skin items to the same {title, kind, value, imageUrl, weight} shape the
  // days/percent/coins items already use, so rewardText/rarityOf/roulette stay generic.
  casesList = data.cases.map((c) => ({
    ...c,
    items: c.items.map((it) => it.kind === 'skin'
      ? { ...it, title: it.skin_display_name || it.title, value: it.skin_price_rub, imageUrl: it.image_url }

  }));

function openCaseModal(key) {
  const c = casesList.find((cc) => cc.key === key);
  if (!c) return;
  const group = casesList.filter((cc) => (cc.currency === 'days') === (c.currency === 'days'));
  const tierIdx = group.findIndex((cc) => cc.key === key) % TIER_ICONS.length;
  const totalWeight = c.items.reduce((s, it) => s + Math.max(0, it.weight), 0);
  activeCase = { c, tierIdx, totalWeight, spinning: false };

  document.getElementById('cm-crate').className = `case-crate tier-${tierIdx}`;
  document.getElementById('cm-crate').style.cssText = 'width:76px;height:76px;margin:0';
  document.getElementById('cm-emblem').innerHTML = svgIcon(TIER_ICONS[tierIdx], 32);

    </div>`).join('');

  const openBtn = document.getElementById('cm-open-btn');

function closeCaseModal() {
  if (activeCase && activeCase.spinning) return;
  document.getElementById('case-modal').classList.remove('show');
}
document.getElementById('case-modal-close').addEventListener('click', closeCaseModal);
document.getElementById('case-modal').addEventListener('click', (e) => {

});

async function startCaseOpen() {
  if (!activeCase || activeCase.spinning) return;
  const { c } = activeCase;
  const openBtn = document.getElementById('cm-open-btn');
  openBtn.disabled = true;

  let result;
  try {
    result = await api(`/api/app/cases/${c.key}/open`, { method: 'POST' });
  } catch (e) {
    openBtn.disabled = false;
    let payload = null;
    try { payload = JSON.parse(e.message); } catch {}
    const desc = payload?.error === 'not_enough_days'
      ? 'Не хватает дней подписки на этот кейс.'
      : 'Заработайте монеты, купив подписку.';
    showResult({ title: 'Недостаточно средств', desc }, true);
    return;
  }

  activeCase.spinning = true;
  document.querySelector('.cm-prizes-title').style.display = 'none';
  document.getElementById('cm-prizes').style.display = 'none';
  openBtn.style.display = 'none';
  runRoulette(c.items, activeCase.totalWeight, result.item, () => {
    activeCase.spinning = false;
    showResult(result.item);
  });
}

function runRoulette(items, totalWeight, winner, onDone) {
  const wrap = document.getElementById('roulette-wrap');
  const strip = document.getElementById('roulette-strip');
  wrap.style.display = 'block';

  const CELL_COUNT = 60;
  const WIN_INDEX = 50;
  const CELL_W = 92 + 12; // width + margins

  const cellsHtml = [];
  for (let i = 0; i < CELL_COUNT; i++) {
    const it = i === WIN_INDEX ? winner : pickWeightedClient(items);
    cellsHtml.push(`
      <div class="roulette-cell ${rarityOf(it, totalWeight)}" data-idx="${i}">
        <div class="rc-icon">${prizeIconHtml(it, 40)}</div>
      </div>`);
  }
  strip.innerHTML = cellsHtml.join('');
  strip.style.transition = 'none';
  strip.style.transform = 'translateX(0px)';

  const viewportWidth = wrap.querySelector('.roulette-viewport').clientWidth;
  const jitter = (Math.random() - 0.5) * (CELL_W * 0.5);
  const targetX = -(WIN_INDEX * CELL_W + CELL_W / 2 - viewportWidth / 2) + jitter;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      strip.style.transition = 'transform 4.2s cubic-bezier(0.1,0.83,0.15,1)';
      strip.style.transform = `translateX(${targetX}px)`;
    });
  });

  setTimeout(() => {
    const winCell = strip.querySelector(`.roulette-cell[data-idx="${WIN_INDEX}"]`);
    if (winCell) winCell.classList.add('win');
    setTimeout(onDone, 700);
  }, 4300);
}

function launchConfetti() {
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#ff9b19', '#ff670b', '#ffd27a', '#4ee89b', '#3fd8ff', '#ff2fb0'];
  const particles = Array.from({ length: 140 }, () => ({
    x: canvas.width / 2 + (Math.random() - 0.5) * 60,
    y: canvas.height * 0.4 + (Math.random() - 0.5) * 40,
    vx: (Math.random() - 0.5) * 14,
    vy: Math.random() * -14 - 4,
    size: Math.random() * 5 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.3,
  }));
  const start = performance.now();
  function frame(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.vy += 0.32;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
    if (now - start < 1800) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

function showResult(item, isError) {
  document.getElementById('result-icon').innerHTML = svgIcon(isError ? 'frown' : 'trophy', 40, {
    color: isError ? '#ff8a8a' : '#ff9fe0',
    strokeWidth: 1.6,
  });
  document.getElementById('result-title').textContent = item.title;
  document.getElementById('result-desc').textContent = item.desc
    ? item.desc
    : isError ? 'Попробуйте ещё раз.' : rewardText(item);
  const overlay = document.getElementById('result-overlay');
  const card = overlay.querySelector('.result-card');
  overlay.classList.remove('lose');
  card.classList.remove('lose');
  overlay.classList.add('show');
  if (isError) {
    void overlay.offsetWidth; // restart the shake/flash animation on repeated losses
    overlay.classList.add('lose');
    card.classList.add('lose');
  } else {
    launchConfetti();
  }
}
document.getElementById('result-close').addEventListener('click', () => {
  const overlay = document.getElementById('result-overlay');
  overlay.classList.remove('show', 'lose');
  overlay.querySelector('.result-card').classList.remove('lose');
  renderCabinet();
  if (activeCase) openCaseModal(activeCase.c.key);
  else if (activeUpgrade) renderUpgradeTab();
  else document.getElementById('case-modal').classList.remove('show');
});

// --- Круг апгрейдера: subscription-upgrade gauge ---

function daysUntil(sqlDate) {
  const ms = new Date(sqlDate.replace(' ', 'T') + 'Z').getTime() - Date.now();
  return Math.max(1, Math.ceil(ms / 86400000));
}

function daysWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'день';
  if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return 'дня';
  return 'дней';
}

function ugArcParts(chance) {
  const half = chance * 1.8; // % of 360°, split evenly either side of the bottom (180°)
  return { half, start: 180 - half, end: 180 + half };
}

function ugGaugeSvg() {
  return `
    <svg viewBox="0 0 440 440" role="img" aria-label="Круг апгрейдера" style="display:block;width:100%;height:100%;">
      <defs>
        <linearGradient id="ug-orange" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#ff9b19"/><stop offset=".55" stop-color="#ff670b"/><stop offset="1" stop-color="#d84008"/>
        </linearGradient>
      </defs>
      <circle cx="220" cy="220" r="171" fill="#080b0f" stroke="#050609" stroke-width="15"/>
      <circle cx="220" cy="220" r="183" fill="none" stroke="#303742" stroke-width="28"/>
      <circle id="ug-arc" cx="220" cy="220" r="183" fill="none" stroke="url(#ug-orange)" stroke-width="28" pathLength="100" stroke-linecap="round"/>
      <circle cx="220" cy="220" r="131" fill="none" stroke="#171d24" stroke-width="12"/>
      <path d="M138 237l37-58 43 27 59-15 38 38-61 21-32 38-25-28z" fill="none" stroke="#d9660e" stroke-width="7" opacity=".82"/>
      <path d="M167 198l94 46-48 9 27 30M194 215l-16 56M256 212l-42 41 67-19" fill="none" stroke="#f07912" stroke-width="4" stroke-linecap="round"/>
      <g id="ug-needle" class="ug-needle">
        <polygon points="220,42 239,82 220,111 201,82" fill="#ff6810" stroke="#ffbc38" stroke-width="2" style="filter:drop-shadow(0 4px 5px #000c);"/>
        <polygon points="220,50 232,81 220,101" fill="#ffd15c" opacity=".6"/>
      </g>
    </svg>`;
}

function ugApplyArc(chance) {
  const { half } = ugArcParts(chance);
  const arc = document.getElementById('ug-arc');
  arc.setAttribute('stroke-dasharray', `${chance} ${100 - chance}`);
  arc.setAttribute('transform', `rotate(${90 - half} 220 220)`);
}

async function renderUpgradeTab() {
  const el = document.getElementById('view-upgrade');
  el.innerHTML = '<div class="card muted">Загрузка…</div>';
  let me, status;
  try {
    [me, status] = await Promise.all([api('/api/app/me'), fetch('/api/status').then((r) => r.json())]);
  } catch {
    el.innerHTML = '<div class="card muted">Откройте раздел из бота TOKYO VPN.</div>';
    return;
  }

  const multipliers = status.upgradeMultipliers;
  const daysNow = me.subscription ? daysUntil(me.subscription.expiresAt) : 0;
  const coinsNow = me.coins;
  const maxByType = { days: daysNow, coins: coinsNow };

  if (daysNow <= 0 && coinsNow <= 0) {
    el.innerHTML = '<div class="card muted">Нужна активная подписка или монеты, чтобы играть в апгрейд.</div><div id="ug-skin-section"></div>';
    renderSkinUpgradeSection(daysNow, status.dayPriceRub, status.upgradeSkinChanceMin, status.upgradeSkinChanceMax);
    return;
  }

  const firstMult = Number(Object.keys(multipliers)[0]);
  const keepType = activeUpgrade && maxByType[activeUpgrade.stakeType] > 0 ? activeUpgrade.stakeType : (daysNow > 0 ? 'days' : 'coins');
  activeUpgrade = {
    multiplier: multipliers[5] ? 5 : firstMult,
    stakeType: keepType,
    stakeAmount: Math.max(1, Math.ceil(maxByType[keepType] / 2)),
    spinning: false,
  };

  el.innerHTML = `
    <div class="ug-panel">
      <div class="ug-eyebrow"><span>Апгрейд подписки</span><span class="ug-live">вращение активно</span></div>
      <div class="ug-sub-row">
        <span style="font-size:12.5px;color:#89919d;">Доступно</span>
        <span style="font-size:15px;font-weight:800;">${daysNow} ${daysWord(daysNow)} · ${coinsNow} монет</span>
      </div>

      <div class="ug-stake-toggle" id="ug-stake-toggle">
        <div class="ug-stake-btn" data-type="days" ${daysNow <= 0 ? 'style="opacity:.4;pointer-events:none;"' : ''}>${svgIcon('shieldCheck', 14)} Дни подписки</div>
        <div class="ug-stake-btn" data-type="coins" ${coinsNow <= 0 ? 'style="opacity:.4;pointer-events:none;"' : ''}>${svgIcon('coin', 14)} Монеты</div>
      </div>

      <div class="ug-slider-row">
        <div class="ug-slider-label"><span>Ставка</span><b id="ug-stake-value"></b></div>
        <input type="range" class="ug-slider" id="ug-stake-slider" min="1" step="1">
      </div>

      <div class="ug-mult-grid" id="ug-mult-grid">
        ${Object.entries(multipliers).map(([m, chance]) => `
          <div class="ug-mult-btn" data-mult="${m}">
            <div class="ug-mult-val">×${m}</div>
            <div class="ug-mult-chance">${chance}%</div>
          </div>`).join('')}
      </div>
      <div class="ug-gauge-wrap">
        ${ugGaugeSvg()}
        <div class="ug-center"><div class="ug-percent" id="ug-percent"></div><div class="ug-caption" id="ug-caption"></div></div>
      </div>
      <div class="ug-outcome">
        <div style="text-align:center;"><div style="font-size:15px;font-weight:800;" id="ug-stake-preview"></div><div style="font-size:10px;color:#89919d;margin-top:2px;">на кону</div></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6c7482" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <div style="text-align:center;"><div style="font-size:16px;font-weight:800;background:linear-gradient(180deg,#ff9b19,#ff670b 55%,#d84008);-webkit-background-clip:text;background-clip:text;color:transparent;" id="ug-after"></div><div style="font-size:10px;color:#89919d;margin-top:2px;">при удаче</div></div>
      </div>
      <button class="ug-cta" id="ug-cta"></button>
      <div class="ug-hint">Если спин неудачный — поставленное сгорает. Играй осознанно.</div>
      <a class="ug-fair-link" href="/fair-play.html" target="_blank" rel="noopener">Условия честной игры и реальные шансы →</a>
    </div>
    <div id="ug-skin-section"></div>`;
  renderSkinUpgradeSection(daysNow, status.dayPriceRub, status.upgradeSkinChanceMin, status.upgradeSkinChanceMax);

  document.querySelectorAll('#ug-stake-toggle .ug-stake-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (activeUpgrade.spinning || maxByType[btn.dataset.type] <= 0) return;
      activeUpgrade.stakeType = btn.dataset.type;
      activeUpgrade.stakeAmount = Math.max(1, Math.ceil(maxByType[btn.dataset.type] / 2));
      ugRenderSelection(multipliers, maxByType);
    });
  });

  document.getElementById('ug-stake-slider').addEventListener('input', (e) => {
    activeUpgrade.stakeAmount = Number(e.target.value);
    ugRenderSelection(multipliers, maxByType);
  });

  document.querySelectorAll('#ug-mult-grid .ug-mult-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (activeUpgrade.spinning) return;
      activeUpgrade.multiplier = Number(btn.dataset.mult);
      ugRenderSelection(multipliers, maxByType);
    });
  });

  ugRenderSelection(multipliers, maxByType);
}

function ugRenderSelection(multipliers, maxByType) {
  const { multiplier, stakeType } = activeUpgrade;
  const max = Math.max(1, maxByType[stakeType]);
  const chance = multipliers[multiplier];

  document.querySelectorAll('#ug-stake-toggle .ug-stake-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.type === stakeType);
  });

  const slider = document.getElementById('ug-stake-slider');
  slider.max = String(max);
  activeUpgrade.stakeAmount = Math.min(Math.max(1, activeUpgrade.stakeAmount), max);
  slider.value = String(activeUpgrade.stakeAmount);
  const unit = (n) => (stakeType === 'days' ? daysWord(n) : 'монет');
  document.getElementById('ug-stake-value').textContent = `${activeUpgrade.stakeAmount} ${unit(activeUpgrade.stakeAmount)}`;

  document.querySelectorAll('#ug-mult-grid .ug-mult-btn').forEach((btn) => {
    btn.classList.toggle('active', Number(btn.dataset.mult) === multiplier);
  });
  document.getElementById('ug-percent').textContent = `${chance.toFixed(2)}%`;
  document.getElementById('ug-caption').textContent = `Шанс на ×${multiplier}`;
  document.getElementById('ug-stake-preview').textContent = `${activeUpgrade.stakeAmount} ${unit(activeUpgrade.stakeAmount)}`;
  const afterAmount = activeUpgrade.stakeAmount * multiplier;
  document.getElementById('ug-after').textContent = `${afterAmount} ${unit(afterAmount)}`;
  const cta = document.getElementById('ug-cta');
  cta.disabled = false;
  cta.textContent = `Улучшить на ×${multiplier}`;
  cta.onclick = () => startUpgradeSpin(multipliers, maxByType);
  ugApplyArc(chance);
  const needle = document.getElementById('ug-needle');
  needle.style.transition = 'none';
  needle.style.transform = 'rotate(0deg)';
}

async function startUpgradeSpin(multipliers, maxByType) {
  if (!activeUpgrade || activeUpgrade.spinning) return;
  activeUpgrade.spinning = true;
  document.getElementById('ug-cta').disabled = true;
  document.querySelectorAll('#ug-mult-grid .ug-mult-btn').forEach((b) => (b.style.pointerEvents = 'none'));
  document.querySelectorAll('#ug-stake-toggle .ug-stake-btn').forEach((b) => (b.style.pointerEvents = 'none'));
  document.getElementById('ug-stake-slider').disabled = true;

  const { multiplier, stakeType, stakeAmount } = activeUpgrade;
  let result;
  try {
    result = await api('/api/app/upgrade', { method: 'POST', body: JSON.stringify({ multiplier, stakeType, stakeAmount }) });
  } catch (e) {
    activeUpgrade.spinning = false;
    document.getElementById('ug-cta').disabled = false;
    document.querySelectorAll('#ug-mult-grid .ug-mult-btn').forEach((b) => (b.style.pointerEvents = ''));
    document.querySelectorAll('#ug-stake-toggle .ug-stake-btn').forEach((b) => (b.style.pointerEvents = ''));
    document.getElementById('ug-stake-slider').disabled = false;
    showResult({ title: 'Не получилось', desc: 'Попробуйте ещё раз чуть позже.' }, true);
    return;
  }

  const { half, start, end } = ugArcParts(result.chance);
  let landing;
  if (result.win) {
    landing = 180 + (Math.random() - 0.5) * half * 1.2;
  } else {
    const safeSpan = 360 - (end - start) - 16;
    landing = (end + 8 + Math.random() * safeSpan) % 360;
  }
  const needle = document.getElementById('ug-needle');
  needle.style.transition = 'transform 3.4s cubic-bezier(.13,.7,.18,1)';
  needle.style.transform = `rotate(${5 * 360 + landing}deg)`;

  setTimeout(() => {
    activeUpgrade.spinning = false;
    const unit = result.stakeType === 'days' ? daysWord(result.stakeAmount) : 'монет';
    if (result.win) {
      showResult({ title: 'Апгрейд удался!', desc: `${result.stakeAmount} → ${result.resultAmount} ${unit}` });
    } else {
      const lost = result.stakeType === 'days' ? 'Дни подписки сгорели.' : 'Монеты сгорели.';
      showResult({ title: 'Апгрейд не удался', desc: `${lost} Оформите подписку или зарабатывайте монеты в кейсах.` }, true);
    }
  }, 3500);
}

// --- Апгрейд на скин: stake days or an owned skin at one specific, more valuable target skin ---

let activeSkinUpgrade = null; // { stakeType, stakeAmount, stakeInventoryId, targetSkinId, spinning }

async function renderSkinUpgradeSection(daysNow, dayPriceRub, chanceMin, chanceMax) {
  const container = document.getElementById('ug-skin-section');
  if (!container) return;
  container.innerHTML = '<div class="muted" style="text-align:center;padding:10px;">Загрузка…</div>';
  let inv, catalog;
  try {
    [inv, catalog] = await Promise.all([api('/api/app/inventory'), api('/api/app/skins')]);
  } catch {
    container.innerHTML = '';
    return;
  }
  const ownedSkins = inv.items.filter((it) => it.status === 'owned');
  const targets = catalog.skins;
  if (!targets.length || (daysNow <= 0 && !ownedSkins.length)) {
    container.innerHTML = daysNow <= 0 && !ownedSkins.length
      ? '<div class="card muted" style="margin-top:14px;">Нужны дни подписки или скин в инвентаре, чтобы играть в апгрейд на скин.</div>'
      : '';
    return;
  }

  const keepType = activeSkinUpgrade && ((activeSkinUpgrade.stakeType === 'days' && daysNow > 0) || (activeSkinUpgrade.stakeType === 'skin' && ownedSkins.length))
    ? activeSkinUpgrade.stakeType
    : (daysNow > 0 ? 'days' : 'skin');
  activeSkinUpgrade = {
    stakeType: keepType,
    stakeAmount: Math.max(1, Math.min(daysNow || 1, Math.ceil((daysNow || 1) / 4))),
    stakeInventoryId: ownedSkins[0]?.id ?? null,
    targetSkinId: targets[0]?.id ?? null,
    spinning: false,
  };

  container.innerHTML = `
    <div class="ug-panel" style="margin-top:14px;">
      <div class="ug-eyebrow"><span>Апгрейд на скин</span></div>
      <div class="ug-stake-toggle" id="ugs-stake-toggle">
        <div class="ug-stake-btn" data-type="days" ${daysNow <= 0 ? 'style="opacity:.4;pointer-events:none;"' : ''}>${svgIcon('shieldCheck', 14)} Дни</div>
        <div class="ug-stake-btn" data-type="skin" ${!ownedSkins.length ? 'style="opacity:.4;pointer-events:none;"' : ''}>${svgIcon('gem', 14)} Скин из инвентаря</div>
      </div>
      <div id="ugs-stake-body"></div>
      <div class="ug-slider-row">
        <div class="ug-slider-label"><span>Цель</span></div>
        <select class="field-select" id="ugs-target" style="width:100%;">
          ${targets.map((s) => `<option value="${s.id}">${s.display_name} — ${s.price_rub.toFixed(2)} ₽</option>`).join('')}
        </select>
      </div>
      <div class="ug-outcome">
        <div style="text-align:center;"><div style="font-size:20px;font-weight:800;" id="ugs-chance">—</div><div style="font-size:10px;color:#89919d;margin-top:2px;">шанс (${chanceMin}–${chanceMax}%)</div></div>
      </div>
      <button class="ug-cta" id="ugs-cta">Апгрейднуть</button>
      <div class="ug-hint" id="ugs-hint">Если спин неудачный — ставка сгорает. Реальный шанс ниже отображаемого — см. условия честной игры.</div>
      <a class="ug-fair-link" href="/fair-play.html" target="_blank" rel="noopener">Условия честной игры и реальные шансы →</a>
    </div>`;

  function renderStakeBody() {
    const body = document.getElementById('ugs-stake-body');
    if (activeSkinUpgrade.stakeType === 'days') {
      body.innerHTML = `
        <div class="ug-slider-row">
          <div class="ug-slider-label"><span>Ставка (дней)</span><b id="ugs-stake-value"></b></div>
          <input type="range" class="ug-slider" id="ugs-days-slider" min="1" max="${Math.max(1, daysNow)}" step="1">
        </div>`;
      const slider = document.getElementById('ugs-days-slider');
      activeSkinUpgrade.stakeAmount = Math.min(Math.max(1, activeSkinUpgrade.stakeAmount), Math.max(1, daysNow));
      slider.value = String(activeSkinUpgrade.stakeAmount);
      document.getElementById('ugs-stake-value').textContent = `${activeSkinUpgrade.stakeAmount} ${daysWord(activeSkinUpgrade.stakeAmount)} ≈ ${(activeSkinUpgrade.stakeAmount * dayPriceRub).toFixed(2)} ₽`;
      slider.addEventListener('input', (e) => {
        activeSkinUpgrade.stakeAmount = Number(e.target.value);
        document.getElementById('ugs-stake-value').textContent = `${activeSkinUpgrade.stakeAmount} ${daysWord(activeSkinUpgrade.stakeAmount)} ≈ ${(activeSkinUpgrade.stakeAmount * dayPriceRub).toFixed(2)} ₽`;
        recomputeChance();
      });
    } else {
      body.innerHTML = `
        <div class="ug-slider-row">
          <div class="ug-slider-label"><span>Ваш скин</span></div>
          <select class="field-select" id="ugs-stake-skin" style="width:100%;">
            ${ownedSkins.map((it) => `<option value="${it.id}">${it.display_name} — ${it.price_rub_at_win.toFixed(2)} ₽</option>`).join('')}
          </select>
        </div>`;
      activeSkinUpgrade.stakeInventoryId = ownedSkins[0]?.id ?? null;
      document.getElementById('ugs-stake-skin').addEventListener('change', (e) => {
        activeSkinUpgrade.stakeInventoryId = Number(e.target.value);
        recomputeChance();
      });
    }
  }

  function stakeValueRub() {
    if (activeSkinUpgrade.stakeType === 'days') return activeSkinUpgrade.stakeAmount * dayPriceRub;
    const owned = ownedSkins.find((it) => it.id === activeSkinUpgrade.stakeInventoryId);
    return owned ? owned.price_rub_at_win : 0;
  }

  function recomputeChance() {
    const target = targets.find((s) => s.id === activeSkinUpgrade.targetSkinId);
    const cta = document.getElementById('ugs-cta');
    if (!target) { document.getElementById('ugs-chance').textContent = '—'; cta.disabled = true; return; }
    const sv = stakeValueRub();
    if (!(target.price_rub > sv)) {
      document.getElementById('ugs-chance').textContent = '—';
      document.getElementById('ugs-hint').textContent = 'Выберите цель дороже вашей ставки.';
      cta.disabled = true;
      return;
    }
    const chance = Math.min(chanceMax, Math.max(chanceMin, (sv / target.price_rub) * 100));
    document.getElementById('ugs-chance').textContent = `${chance.toFixed(1)}%`;
    document.getElementById('ugs-hint').textContent = 'Если спин неудачный — ставка сгорает. Реальный шанс ниже отображаемого — см. условия честной игры.';
    cta.disabled = false;
  }

  document.querySelectorAll('#ugs-stake-toggle .ug-stake-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.type === activeSkinUpgrade.stakeType);
    btn.addEventListener('click', () => {
      if (activeSkinUpgrade.spinning) return;
      activeSkinUpgrade.stakeType = btn.dataset.type;
      document.querySelectorAll('#ugs-stake-toggle .ug-stake-btn').forEach((b) => b.classList.toggle('active', b === btn));
      renderStakeBody();
      recomputeChance();
    });
  });

  document.getElementById('ugs-target').addEventListener('change', (e) => {
    activeSkinUpgrade.targetSkinId = Number(e.target.value);
    recomputeChance();
  });

  renderStakeBody();
  recomputeChance();

  document.getElementById('ugs-cta').addEventListener('click', () => startSkinUpgradeSpin());
}

async function startSkinUpgradeSpin() {
  if (!activeSkinUpgrade || activeSkinUpgrade.spinning) return;
  activeSkinUpgrade.spinning = true;
  const cta = document.getElementById('ugs-cta');
  cta.disabled = true;

  const { stakeType, stakeAmount, stakeInventoryId, targetSkinId } = activeSkinUpgrade;
  let result;
  try {
    result = await api('/api/app/upgrade', {
      method: 'POST',
      body: JSON.stringify({ stakeType, stakeAmount, stakeInventoryId, targetSkinId }),
    });
  } catch (e) {
    activeSkinUpgrade.spinning = false;
    cta.disabled = false;
    let payload = null;
    try { payload = JSON.parse(e.message); } catch {}
    const desc = payload?.error === 'target_not_higher' ? 'Цель должна быть дороже вашей ставки.' : 'Попробуйте ещё раз чуть позже.';
    showResult({ title: 'Не получилось', desc }, true);
    return;
  }

  activeSkinUpgrade.spinning = false;
  if (result.win) {
    showResult({ title: 'Апгрейд удался!', desc: `Вы выиграли: ${result.targetSkin.display_name} · ${Math.round(result.targetSkin.price_rub).toLocaleString('ru-RU')} ₽` });
  } else {
    showResult({ title: 'Апгрейд не удался', desc: 'Ставка сгорела. Попробуйте ещё раз.' }, true);
  }
  renderUpgradeTab();
}

function switchTab(name) {
  document.getElementById('tab-cabinet').classList.toggle('active', name === 'cabinet');
  document.getElementById('tab-subs').classList.toggle('active', name === 'subs');
  document.getElementById('tab-cases').classList.toggle('active', name === 'cases');
  document.getElementById('tab-upgrade').classList.toggle('active', name === 'upgrade');
  document.getElementById('view-cabinet').style.display = name === 'cabinet' ? '' : 'none';
  document.getElementById('view-subs').style.display = name === 'subs' ? '' : 'none';
  document.getElementById('view-cases').style.display = name === 'cases' ? '' : 'none';
  document.getElementById('view-upgrade').style.display = name === 'upgrade' ? '' : 'none';
  if (name === 'cases') renderCases();
  if (name === 'subs') renderSubs();
  if (name === 'upgrade') renderUpgradeTab();
}
document.getElementById('tab-cabinet').addEventListener('click', () => switchTab('cabinet'));
document.getElementById('tab-subs').addEventListener('click', () => switchTab('subs'));
document.getElementById('tab-cases').addEventListener('click', () => switchTab('cases'));
document.getElementById('tab-upgrade').addEventListener('click', () => switchTab('upgrade'));

const tabParam = new URLSearchParams(location.search).get('tab');
const initialTab = tabParam === 'cases' ? 'cases' : tabParam === 'subs' ? 'subs' : tabParam === 'upgrade' ? 'upgrade' : 'cabinet';
switchTab(initialTab);
renderCabinet();
</script>
